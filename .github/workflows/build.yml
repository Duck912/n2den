# SPDX-License-Identifier: GPL-3.0-or-later
# n2den test builds. Windows (MSVC) runs on every push to main and from the Actions tab;
# the Linux AppImage (Eden-CI's recipe: Arch container, quick-sharun) only from the Actions
# tab with "Also build the Linux AppImage" ticked.

name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      linux:
        description: Also build the Linux AppImage
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux AppImage
    if: github.event_name == 'workflow_dispatch' && inputs.linux
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest
      options: --privileged --device /dev/fuse
    defaults:
      run:
        shell: bash
    env:
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checkout
        run: |
          git config --global --add safe.directory '*'
          # github.workspace is the host path inside containers; use the container's own.
          echo "CCACHE_DIR=$PWD/.ccache" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          for _ in 1 2 3; do
            if pacman -Syu --noconfirm --needed --overwrite '*' \
                base-devel boost boost-libs catch2 ccache cmake curl enet ffnvcodec-headers fmt \
                gamemode git glslang jq libva libvdpau libvpx libxcursor libxss nasm ninja \
                nlohmann-json patchelf pulseaudio pulseaudio-alsa python-requests qt6-base \
                qt6-charts qt6-tools qt6-wayland spirv-headers spirv-tools unzip \
                vulkan-headers vulkan-mesa-layers vulkan-utility-libraries wget xcb-util-cursor \
                xcb-util-image xcb-util-renderutil xcb-util-wm zip; then break; fi
          done
          wget -q --retry-connrefused --tries=30 \
            https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/refs/heads/main/useful-tools/get-debloated-pkgs.sh
          chmod +x get-debloated-pkgs.sh
          ./get-debloated-pkgs.sh --add-mesa qt6-base-mini libxml2-mini opus-nano

      - name: CPM cache
        uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: cpm-linux-${{ hashFiles('**/cpmfile.json') }}
          restore-keys: cpm-linux-

      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DENABLE_QT=ON -DYUZU_USE_BUNDLED_QT=OFF -DENABLE_QT_TRANSLATION=OFF \
            -DENABLE_UPDATE_CHECKER=OFF -DENABLE_WEB_SERVICE=OFF -DENABLE_LTO=OFF \
            -DYUZU_USE_BUNDLED_FFMPEG=ON -DYUZU_USE_BUNDLED_SIRIT=ON \
            -DYUZU_USE_BUNDLED_OPENSSL=ON -DYUZU_USE_BUNDLED_SDL3=ON \
            -DYUZU_DISABLE_LLVM=ON -DYUZU_CMD=ON -DYUZU_ROOM_STANDALONE=OFF \
            -DBUILD_TESTING=OFF -DYUZU_TESTS=OFF -DDYNARMIC_TESTS=OFF -DENABLE_WERROR=OFF

      - name: Build
        run: |
          cmake --build build --target yuzu yuzu-cmd
          ccache -s

      - name: Package
        run: |
          export ICON="$PWD/dist/dev.eden_emu.eden.svg"
          export DESKTOP="$PWD/dist/dev.eden_emu.eden.desktop"
          export OPTIMIZE_LAUNCH=1 DEPLOY_OPENGL=1 DEPLOY_VULKAN=1
          export ADD_HOOKS="wayland-is-broken.hook"
          export OUTPATH="$PWD/artifacts"
          export OUTNAME="n2den-linux-${GITHUB_SHA::7}-x86_64.AppImage"
          curl -fL --retry 30 -o quick-sharun \
            https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/refs/heads/main/useful-tools/quick-sharun.sh
          chmod a+x quick-sharun
          ./quick-sharun build/bin/eden build/bin/eden-cli
          ./quick-sharun --make-appimage
          rm -f "$OUTPATH"/*.zsync
          sed "s/@COMMIT@/${GITHUB_SHA}/" dist/testers/README-n2den-linux.txt > "$OUTPATH/README.txt"
          cp LICENSE.txt "$OUTPATH/"
          ls -la "$OUTPATH"

      - uses: actions/upload-artifact@v4
        with:
          name: n2den-linux-x86_64
          path: artifacts/
          retention-days: 30

  windows:
    name: Windows
    runs-on: windows-2022
    timeout-minutes: 345
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Runner
        shell: pwsh
        run: |
          $cs = Get-CimInstance Win32_ComputerSystem
          "{0} logical processors, {1:N1} GB RAM" -f $cs.NumberOfLogicalProcessors, ($cs.TotalPhysicalMemory / 1GB)
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n = 'Free GB'; e = { [math]::Round($_.Free / 1GB, 1) } }
          cmake --version

      - name: CPM cache
        uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: cpm-windows-${{ hashFiles('**/cpmfile.json') }}
          restore-keys: cpm-windows-

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install Vulkan SDK
        shell: powershell
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Compiler cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          # CPM applies patches with Git's patch.exe; append so Git's link.exe never shadows MSVC's.
          $env:PATH = "$env:PATH;C:\Program Files\Git\usr\bin"
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DENABLE_QT=ON -DYUZU_USE_BUNDLED_QT=OFF "-DQt6_DIR=$env:QT_ROOT_DIR/lib/cmake/Qt6" `
            -DYUZU_CMD=ON -DYUZU_ROOM=OFF `
            -DBUILD_TESTING=OFF -DYUZU_TESTS=OFF -DDYNARMIC_TESTS=OFF `
            -DENABLE_CUBEB=OFF -DENABLE_RESHADE=OFF -DENABLE_NVIDIA_DLSS=ON -DENABLE_OPENGL=OFF `
            -DENABLE_WEB_SERVICE=OFF -DENABLE_UPDATE_CHECKER=OFF -DENABLE_LTO=OFF `
            -DYUZU_DISABLE_LLVM=ON -DENABLE_WERROR=OFF -DEDEN_PROFILE_SYMBOLS=ON

      - name: Build
        shell: pwsh
        run: |
          $env:PATH = "$env:PATH;C:\Program Files\Git\usr\bin"
          # One compile per logical processor: the runner's RAM does not hold more of the heavy
          # MSVC jobs.
          cmake --build build --target yuzu yuzu-cmd --parallel $env:NUMBER_OF_PROCESSORS
          sccache --show-stats

      - name: Package
        shell: pwsh
        run: |
          $name = "n2Den-windows-x64-$($env:GITHUB_SHA.Substring(0, 7))"
          ./tools/windows/package.ps1 -Build build -Name $name -Commit $env:GITHUB_SHA
          "PACKAGE=$name" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: artifacts/${{ env.PACKAGE }}/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}-symbols
          path: artifacts/${{ env.PACKAGE }}-symbols/
          retention-days: 30
          if-no-files-found: ignore
